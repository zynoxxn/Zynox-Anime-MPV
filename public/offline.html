<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050A14" />
    <title>Offline — ZYNOX ANIME</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #050A14;
        color: #FFFFFF;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background-color: #0B1324;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #94A3B8;
      }
      button {
        height: 44px;
        padding: 0 24px;
        border: none;
        border-radius: 12px;
        background-color: #1E88FF;
        color: #FFFFFF;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background-color: #3B9BFF;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You Are Offline</h1>
      <p>
        Check your internet connection and try again. Cached pages remain accessible once reconnected.
      </p>
      <button type="button" onclick="window.location.reload()">Retry Connection</button>
    </main>
  </body>
</html>
